x-node-common: &common
  image: kademlia
  stdin_open: true
  tty: true
  restart: on-failure
  volumes: 
    - ./dns/resolv.conf:/etc/resolv.conf:ro

services:
  seed:
    depends_on:
      - dns
    <<: *common #reuses common
    build: . # build the seed, calls it kademlia
    command: sh -c 'exec kademlia --fake-dns "$$(hostname -i):4000"'
    networks:
      kademlia:
        ipv4_address: 172.28.0.10 #fixed ip outside ip range

  node: 
    <<: *common
    # replaces shell with node and bootstraps from seed
    command: sh -c 'sleep $$(shuf -i 0-5 -n 1) && exec kademlia --fake-dns "$$(hostname -i):4000" 172.28.0.10:4000'
    depends_on:
      - seed
      - dns
    deploy:
      replicas: 49
    networks:
      - kademlia

  dns: 
    build: ./dns
    command: >
      dnsmasq -k --no-resolv --log-queries --log-facility=-
      --txt-record=node0.d7024e.test,d7024ePK=61881a788f1c952df69dd7c0510718c54c0adb2c591f65ec671482a4b1d1b5f0
    networks:
      kademlia:
        ipv4_address: 172.28.0.53

  publisher:
    <<: *common
    command: sh -c 'exec kademlia --fake-dns "$$(hostname -i):4000" 172.28.0.10:4000'
    depends_on:
      - seed
      - dns
    secrets:
      - publisher_key
    environment:
      D7024E_SIGNING_KEY_FILE: /run/secrets/publisher_key
    networks:
      kademlia:
        ipv4_address: 172.28.0.11

networks:
  kademlia:
    ipam:
      config:
        - subnet: 172.28.0.0/16   # every address on network
          ip_range: 172.28.1.0/24 # what docker hands out

secrets:
  publisher_key:
    file: ./secrets/publisher.key